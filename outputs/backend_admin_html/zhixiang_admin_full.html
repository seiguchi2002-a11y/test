    :root {
      --primary: #1A65FF;
      --primary-weak: #EAF1FF;
      --primary-deep: #0D47C7;
      --page: #F4F7FB;
      --panel: #FFFFFF;
      --border: #E5EAF2;
      --text: #1F2937;
      --muted: #667085;
      --sidebar: #111827;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    #root { min-height: 100vh; }
    .layout { min-height: 100vh; }
    .sider {
      position: fixed;
      inset: 0 auto 0 0;
      height: 100vh;
      overflow: auto;
      background: var(--sidebar);
      box-shadow: 8px 0 24px rgba(15, 23, 42, 0.12);
    }
    .brand {
      height: 64px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 18px;
      color: #fff;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .brand-logo {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: var(--primary);
      font-weight: 700;
    }
    .brand-text { font-size: 16px; font-weight: 650; white-space: nowrap; }
    .content-layout { margin-left: 252px; min-height: 100vh; }
    .header {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 64px;
      padding: 0 24px;
      background: #fff;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-title { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 650; }
    .main { padding: 20px 24px 32px; }
    .page-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }
    .breadcrumb { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .page-title { margin: 0; font-size: 22px; line-height: 30px; font-weight: 700; }
    .page-desc { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 14px;
    }
    .filters { padding: 18px 18px 2px; }
    .filter-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(180px, 1fr));
      gap: 16px;
    }
    .toolbar {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .table-panel { padding: 0 18px 16px; }
    .table-title-row {
      padding: 14px 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: 13px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }
    .stat {
      min-height: 82px;
      padding: 14px 16px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .stat-label { color: var(--muted); font-size: 13px; }
    .stat-value { margin-top: 8px; font-size: 25px; font-weight: 750; }
    .stat-note { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .detail-section { margin-bottom: 18px; }
    .detail-section-title {
      margin: 0 0 10px;
      font-size: 15px;
      font-weight: 650;
      color: #344054;
    }
    .record-list {
      margin: 0;
      padding-left: 18px;
      color: #475467;
      line-height: 1.8;
    }
    .rich-box {
      min-height: 132px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #FAFBFC;
      line-height: 1.7;
      color: #344054;
    }
    .rich-editor {
      min-height: 180px;
      padding: 12px;
      border: 1px solid #d9d9d9;
      border-radius: 8px;
      background: #fff;
      line-height: 1.7;
      outline: none;
    }
    .rich-editor:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(26, 101, 255, 0.12);
    }
    .tab-panel {
      padding: 0 18px;
    }
    .tab-panel .ant-tabs-nav {
      margin-bottom: 0;
    }
    .image-placeholder {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      background: linear-gradient(135deg, #EAF1FF, #D8E5FF);
      display: grid;
      place-items: center;
      color: var(--primary);
      font-weight: 700;
      border: 1px solid #C9DAFF;
    }
    .ant-layout-sider .ant-menu { background: transparent; color: rgba(255,255,255,.78); }
    .ant-layout-sider .ant-menu-item,
    .ant-layout-sider .ant-menu-submenu-title {
      color: rgba(255,255,255,.78);
      margin-inline: 10px;
      width: calc(100% - 20px);
      border-radius: 6px;
    }
    .ant-layout-sider .ant-menu-item-selected {
      background: var(--primary);
      color: #fff;
      font-weight: 650;
    }
    .ant-layout-sider .ant-menu-submenu-selected > .ant-menu-submenu-title { color: #fff; }
    .ant-btn-primary { background: var(--primary); border-color: var(--primary); box-shadow: none; }
    .ant-btn-primary:hover { background: var(--primary-deep) !important; border-color: var(--primary-deep) !important; }
    .ant-table-wrapper .ant-table-thead > tr > th {
      background: #F7F9FC;
      color: #344054;
      font-weight: 650;
    }
    .ant-table-cell { vertical-align: middle; }
    .danger-link { color: #D92D20; }
    @media (max-width: 1000px) {
      .sider { position: static; height: auto; }
      .content-layout { margin-left: 0; }
      .filter-grid { grid-template-columns: repeat(2, minmax(160px, 1fr)); }
      .stats { grid-template-columns: repeat(2, minmax(150px, 1fr)); }

    function renderValue(record, key, type) {
      const value = record[key];
      if (type === "tag") return tag(value);
      if (type === "phone") return maskPhone(value);
      if (type === "money") return value?.includes?.("积分") ? value : `¥${value}`;
      if (type === "image") return <div className="image-placeholder">图</div>;
      if (type === "singlePreviewImage") {
        if (!value) return "-";
        return (
          <Image
            src={value}
            width={48}
            height={48}
            style={{ objectFit: "cover", borderRadius: 6 }}
          />
        );
      }
      if (type === "previewImage") {
        const images = record[key] || [];
        if (!images.length) return "-";
        return (
          <Image.PreviewGroup>
            <Space size={6}>
              {images.map((src, index) => (
                <Image
                  key={index}
                  src={src}
                  width={48}
                  height={48}
                  style={{ objectFit: "cover", borderRadius: 6 }}
                />
              ))}
            </Space>
          </Image.PreviewGroup>
        );
      }
      if (type === "richPreview") {
        const plainText = String(value || "").replace(/<[^>]+>/g, "");
        return (
          <Typography.Paragraph ellipsis={{ rows: 2 }} style={{ margin: 0, maxWidth: 320 }}>
            {plainText || "-"}
          </Typography.Paragraph>
        );
      }
      if (type === "openidTooltip") {
        return (
          <Tooltip title={record.fullOpenid || value}>
            <span style={{ cursor: "pointer" }}>{value}</span>
          </Tooltip>
        );
      }
      if (type === "ellipsis") return <Typography.Paragraph ellipsis={{ rows: 2 }} style={{ margin: 0, maxWidth: 260 }}>{value}</Typography.Paragraph>;
      return value ?? "-";
    }

    function StatCards({ activeKey }) {

      const enabled = data.filter(item => ["启用", "上架", "正常", "已支付", "已发放", "已完成", "使用中"].some(s => Object.values(item).includes(s))).length;

    const toTimeValue = (time) => dayjs(`2026-01-01 ${time || "09:00"}`);
    const formatBusinessHours = (range, overnight) => {
      const [start, end] = range || [];
      const startText = start ? start.format("HH:mm") : "09:00";
      const endText = end ? end.format("HH:mm") : "22:00";
      return {
        startTime: startText,
        endTime: endText,
        overnight,
        businessHours: `${startText} - ${overnight ? "次日 " : ""}${endText}`
      };
    };
    const buildStoreTreeData = (stores) => options.floor.map(floor => ({
      title: floor,
      key: floor,
      children: stores
        .filter(store => store.floor === floor)
        .map(store => ({ title: `${store.storeName}（${store.berthNo}）`, key: store.id }))
    }));

    function StoreBatchConfigModal({ open, stores, onCancel, onSave }) {
      const [form] = Form.useForm();
      const [checkedKeys, setCheckedKeys] = React.useState([]);
      React.useEffect(() => {
        if (open) {
          form.setFieldsValue({ timeRange: [toTimeValue("09:00"), toTimeValue("22:00")], overnight: false });
          setCheckedKeys([]);

      const renderDetailValue = (key, type) => {
        if (type === "rich") return <div className="rich-box" dangerouslySetInnerHTML={{ __html: record[key] || "" }} />;
        if (type === "list") return <ul className="record-list">{(record[key] || []).map((item, idx) => <li key={idx}>{item}</li>)}</ul>;
        if (type === "links") return <Space wrap><Button>查看配送订单</Button><Button>查看积分兑换订单</Button><Button>查看反馈记录</Button></Space>;
        if (type === "previewImage") return renderValue(record, key, "previewImage");
        if (["status","payStatus","deliveryStatus","useStatus","exchangeStatus","grantStatus"].includes(key)) return tag(record[key]);
        if (key === "phone" && activeKey !== "agreementConsent") return maskPhone(record[key]);
        return record[key] ?? "-";
      };
      return (
        <Drawer title={drawerTitle} width={820} open={!!record} onClose={onClose} extra={<Button onClick={onClose}>关闭</Button>}>
          {record && sections.map(([title, items]) => (
            <div className="detail-section" key={title}>
              <h3 className="detail-section-title">{title}</h3>
              {items.length === 1 && ["rich","list","links"].includes(items[0][2]) ? renderDetailValue(items[0][1], items[0][2]) : (
                <Descriptions bordered column={2} size="small">
                  {items.map(([label, key, type]) => <Descriptions.Item label={label} key={key}>{renderDetailValue(key, type)}</Descriptions.Item>)}
                </Descriptions>
              )}
            </div>
          ))}
        </Drawer>
      );
    }

    function Page({ activeKey }) {
      const [deliveryOrderTab, setDeliveryOrderTab] = React.useState("deliveryOrder");
      const [cardOrderTab, setCardOrderTab] = React.useState("cardOrder");
      const [exchangeConfigTab, setExchangeConfigTab] = React.useState("exchangeConfig");
      const pageKey = activeKey === "deliveryOrder" ? deliveryOrderTab : activeKey === "cardOrder" ? cardOrderTab : activeKey === "exchangeConfig" ? exchangeConfigTab : activeKey;
      const [data, setData] = React.useState(mock[pageKey] || []);
      const [viewData, setViewData] = React.useState(mock[pageKey] || []);
      const [detail, setDetail] = React.useState(null);
      const [editOpen, setEditOpen] = React.useState(false);
      const [editMode, setEditMode] = React.useState("新增");
      const [editRecord, setEditRecord] = React.useState(null);
      const [batchConfigOpen, setBatchConfigOpen] = React.useState(false);
      const [action, setAction] = React.useState(null);
      const [actionRecord, setActionRecord] = React.useState(null);
      const [agreementTab, setAgreementTab] = React.useState("用户协议");
      const [agreementConsentTab, setAgreementConsentTab] = React.useState("用户协议");

      React.useEffect(() => {
        setData(mock[pageKey] || []);
        setViewData(mock[pageKey] || []);
        setDetail(null);
        setEditOpen(false);
        setBatchConfigOpen(false);
        setAction(null);
        if (activeKey === "agreement") {
          setAgreementTab("用户协议");
        }
        if (activeKey === "agreementConsent") {
          setAgreementConsentTab("用户协议");
        }
      }, [activeKey, pageKey]);

      const rows = columns[pageKey] || [];
      const canAdd = ["agreement","exchangeConfig","packageConfig"].includes(pageKey);

      const tableColumns = [
        { title: "序号", width: 72, fixed: "left", render: (_, __, index) => index + 1 },
        ...rows.map(([title, key, type]) => ({
          title,
          dataIndex: key,
          width: ["content","desc"].includes(key) ? 240 : 140,
          render: (_, record) => renderValue(record, key, type)
        })),
        {
          title: "操作",
          key: "action",
          width: 260,
          fixed: "right",
          render: (_, record) => <ActionButtons activeKey={pageKey} record={record} onView={setDetail} onEdit={(r) => { setEditMode("编辑"); setEditRecord(r); setEditOpen(true); }} onAction={(name, r) => { setAction(name); setActionRecord(r); }} onDelete={(r) => {
            Modal.confirm({ title: "确认删除？", content: "删除前请确认该数据未产生业务记录。", okText: "删除", cancelText: "取消", onOk: () => { setViewData(viewData.filter(item => item.id !== r.id)); message.success("删除成功"); } });
          }} />
        }
      ];
      const agreementViewData = pageKey === "agreement"
        ? viewData.filter(item => item.type === agreementTab)
        : viewData;
      const finalTableData = pageKey === "agreementConsent"
        ? viewData.filter(item => item.type === agreementConsentTab)
        : agreementViewData;
      const noActionPages = ["agreementConsent", "deliveryOrderLog", "cardOrderLog", "pointsOrder", "exchangeConfigLog", "feedbackList", "userList"];
      const noExportPages = [
        "agreement",
        "agreementConsent",
        "deliveryOrder",
        "deliveryOrderLog",
        "cardOrder",
        "cardOrderLog",
        "pointsOrder",
        "exchangeConfig",
        "exchangeConfigLog",
        "packageConfig",
        "storeList",
        "robotTask",
        "feedbackList",
        "userList"
      ];

      const handleSave = (values) => {
        if (editMode === "新增") {
          const nextRecord = pageKey === "agreement"
            ? {
                id: `agreement-${Date.now()}`,
                type: agreementTab,
                version: values.version,
                content: values.content,
                createdAt: dayjs().format("YYYY-MM-DD HH:mm"),
                status: "停用"
              }
            : {
                id: `${pageKey}-${Date.now()}`,
                ...values,
                createdAt: dayjs().format("YYYY-MM-DD HH:mm"),
                updatedAt: dayjs().format("YYYY-MM-DD HH:mm")
              };
          const next = [nextRecord, ...viewData];
          setViewData(next);
        } else {
          setViewData(viewData.map(item => item.id === editRecord.id ? { ...item, ...values, updatedAt: dayjs().format("YYYY-MM-DD HH:mm") } : item));
        }
        setEditOpen(false);
        message.success("保存成功");
      };
      const handleStoreHoursSave = (storeIds, values) => {
        const updateItem = (item) => storeIds.includes(item.id) ? { ...item, ...values } : item;
        setData(data.map(updateItem));
        setViewData(viewData.map(updateItem));
        setBatchConfigOpen(false);
        setAction(null);
        setActionRecord(null);
        message.success("保存成功");
      };

      return (
        <>
          {activeKey === "agreement" && (
            <div className="panel tab-panel">
              <Tabs
                activeKey={agreementTab}
                onChange={setAgreementTab}
                items={options.agreementType.map(item => ({ key: item, label: item }))}
              />
            </div>
          )}
          {activeKey === "agreementConsent" && (
            <div className="panel tab-panel">
              <Tabs
                activeKey={agreementConsentTab}
                onChange={setAgreementConsentTab}
                items={options.agreementConsentType.map(item => ({ key: item, label: item }))}
              />
            </div>
          )}
          {activeKey === "deliveryOrder" && (
            <div className="panel tab-panel">
              <Tabs
                activeKey={deliveryOrderTab}
                onChange={setDeliveryOrderTab}
                items={[
                  { key: "deliveryOrder", label: "配送订单" },
                  { key: "deliveryOrderLog", label: "操作日志" }
                ]}
              />
            </div>
          )}
          {activeKey === "exchangeConfig" && (
            <div className="panel tab-panel">
              <Tabs
                activeKey={exchangeConfigTab}
                onChange={setExchangeConfigTab}
                items={[
                  { key: "exchangeConfig", label: "积分兑换配置" },
                  { key: "exchangeConfigLog", label: "操作日志" }
                ]}
              />
            </div>
          )}
          <SearchPanel activeKey={pageKey} onSearch={() => message.success("查询完成")} onReset={() => setViewData(data)} />
          <div className="panel toolbar">
            <Space>
              <Button type="primary" icon={<SearchOutlined />} onClick={() => message.success("查询完成")}>查询</Button>
              <Button icon={<ReloadOutlined />} onClick={() => setViewData(data)}>重置</Button>
              {!noExportPages.includes(pageKey) && <Button icon={<DownloadOutlined />} onClick={() => message.info("导出任务已创建")}>导出</Button>}
              {pageKey === "storeList" && <Button icon={<EditOutlined />} onClick={() => setBatchConfigOpen(true)}>批量配置</Button>}
            </Space>
            {canAdd && <Button type="primary" icon={<PlusOutlined />} onClick={() => { setEditMode("新增"); setEditRecord({ status: pageKey === "agreement" ? "停用" : "下架", content: "" }); setEditOpen(true); }}>{pageKey === "agreement" ? "新增协议" : pageKey === "exchangeConfig" ? "新增商品/权益" : "新增套餐"}</Button>}
          </div>
          <div className="panel table-panel">
            <div className="table-title-row">
              <span>{["deliveryOrderLog", "cardOrderLog", "exchangeConfigLog"].includes(pageKey) ? "操作日志列表" : `${meta[activeKey][1]}列表`}</span>
              <span>分页默认每页 10 条，支持切换 10 / 20 / 50 条；空数据文案：暂无数据。</span>
            </div>
            <Table
              rowKey="id"
              columns={noActionPages.includes(pageKey) ? tableColumns.slice(0, -1) : tableColumns}
              dataSource={finalTableData}
              scroll={{ x: Math.max(1200, tableColumns.length * 150) }}
              locale={{ emptyText: "暂无数据" }}
              pagination={{ defaultPageSize: 10, showSizeChanger: true, pageSizeOptions: [10,20,50], showTotal: total => `共 ${total} 条` }}
            />
          </div>
          <DetailDrawer activeKey={pageKey} record={detail} onClose={() => setDetail(null)} />
          <EditModal open={editOpen} mode={editMode} activeKey={pageKey} agreementTab={agreementTab} record={editRecord} onCancel={() => setEditOpen(false)} onSave={handleSave} />
          <StoreBatchConfigModal open={batchConfigOpen} stores={data} onCancel={() => setBatchConfigOpen(false)} onSave={handleStoreHoursSave} />
          <StoreConfigModal open={action === "configStore"} record={actionRecord} onCancel={() => setAction(null)} onSave={handleStoreHoursSave} />
          <ActionModal action={action === "configStore" ? null : action} record={actionRecord} onClose={() => setAction(null)} />
        </>
      );
    }

    function ActionButtons({ activeKey, record, onView, onEdit, onAction, onDelete }) {
      const actions = {
        agreement: [["查看", () => onView(record)]],
        agreementConsent: [],
        deliveryOrder: [["查看", () => onView(record)], ["退款", () => onAction("refund", record), null, isRefundDisabled(record)]],
        cardOrder: [["补发次数", () => onAction("compensate", record), null, isCardCompensateDisabled(record)]],
        pointsOrder: [],
        exchangeConfig: [["编辑", () => onEdit(record)], [record.status === "上架" ? "下架" : "上架", () => message.success("保存成功")]],
        packageConfig: [["编辑", () => onEdit(record)], [record.status === "上架" ? "下架" : "上架", () => message.success("保存成功")]],
        storeList: [["配置", () => onAction("configStore", record)]],
        robotTask: [["查看", () => onView(record)], ["处理异常", () => record.status === "异常" ? onAction("handleTask", record) : message.warning("只有异常任务可以进行异常处理")]],
        feedbackList: [["查看", () => onView(record)]],
        userList: []
      }[activeKey] || [];
      return (
        <Space size={4} wrap>
          {actions.slice(0, 4).map(([label, fn, danger, disabled]) => <Button key={label} type="link" size="small" danger={danger === "danger"} disabled={disabled} onClick={disabled ? undefined : fn}>{label}</Button>)}
          {actions.length > 4 && (
            <Dropdown menu={{ items: actions.slice(4).map(([label], i) => ({ key: label, label })), onClick: ({ key }) => actions.find(([label]) => label === key)?.[1]() }}>
              <Button type="link" size="small">更多</Button>
            </Dropdown>
          )}
        </Space>
      );
    }

    function AdminApp() {
      const [activeKey, setActiveKey] = React.useState("deliveryOrder");
      const [parent, title, path, desc] = meta[activeKey];
      return (
        <ConfigProvider theme={{
          token: { colorPrimary: primary, colorLink: primary, borderRadius: 8, fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif' },
          components: { Layout: { headerBg: "#FFFFFF", siderBg: "#111827" }, Menu: { darkItemSelectedBg: primary, darkItemSelectedColor: "#FFFFFF" } }
        }}>
          <App>
            <Layout className="layout">
              <Sider className="sider" width={252}>
                <div className="brand"><div className="brand-logo">智</div><div className="brand-text">智慧商贸后台</div></div>
                <Menu theme="dark" mode="inline" items={menuItems} selectedKeys={[activeKey]} defaultOpenKeys={["content","order","points","shop","robot","feedback","user"]} onClick={({ key }) => setActiveKey(key)} />
              </Sider>
              <Layout className="content-layout">
                <Header className="header">
                  <div className="header-title"><MenuFoldOutlined />智慧商贸小程序后台管理系统</div>
                  <Space size={18}><Tag color="blue">运营后台</Tag><Space><UserOutlined />管理员</Space><Button icon={<LogoutOutlined />}>退出登录</Button></Space>
                </Header>
                <Content className="main">
                  <div className="page-head">
                    <div>
                      <div className="breadcrumb">{parent} / {title} <Typography.Text type="secondary">（{path}）</Typography.Text></div>
                      <h1 className="page-title">{title}</h1>
                      <p className="page-desc">{desc}</p>
                    </div>
                    <Dropdown menu={{ items: [{ key: "refresh", label: "刷新页面" }] }}>
                      <Button icon={<MoreOutlined />}>更多操作</Button>
                    </Dropdown>
                  </div>
                  <Page activeKey={activeKey} />
                </Content>
              </Layout>
            </Layout>
          </App>
        </ConfigProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<AdminApp />);
  </script>
</body>
</html>
